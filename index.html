<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Memory ❤️</title>
<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:auto;
}
#content{
    display:none;
    text-align: center;
    width: 100%;
    padding: 40px 0;
}
#login{
    text-align:center;
}
input{
    padding:10px;
    border:none;
    border-radius:8px;
    font-size:18px;
    text-align:center;
}
button{
    padding:10px 20px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
}
#content{
    display:none;
    text-align:center;
}
img{
    width:310px;
    max-width:210%;
    border-radius:15px;
    box-shadow:0 0 20px pink;
}
.quote{
    margin-top:11px;
    font-size:20px;
    color:#ffd6e0;
}
.heart{
    position:absolute;
    color:red;
    animation:float 6s linear infinite;
    font-size:25px;
}
@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>
<body>
<div id="login">
<h2>✨ Enter Secret PIN 💕</h2>
<input type="password" id="pin" placeholder="4-digit PIN">
<br>
<button onclick="checkPin()">Open</button>
</div>
<div id="content">
<!-- Replace myphoto.jpg with your image -->
<img src="pic3.jpg">
<div class="quote">
"I Will Always Be Your Permanent Sky,And not a Passing Clouds🌍🫀🤍✨"<br>

</div>
<!-- Optional Music -->
<audio controls loop>
<source src="ohoh.mp3" type="audio/mp3">
</audio>
</div>
<script>
function checkPin(){
if(document.getElementById("pin").value=="1131"){
document.getElementById("login").style.display="none";
document.getElementById("content").style.display="block";
}else{
alert("Wrong PIN!");
}
}
// Hearts Animation
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💞";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},300);
</script>
</body>
</html>
